<!doctype html>
<!--
  Ägs av mallen — appens kod ändrar inte den här filen.
  Plattformens CSP (script-src 'self') tillåter inga inline-skript, och inga resurser får
  hämtas utifrån: inga CDN:er, inga typsnitt, inga bilder från andra adresser.
-->
<html lang="sv">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="same-origin" />
    <title>App</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Den här appen behöver JavaScript för att fungera.</noscript>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
