# vibesandbox i drift: en docker compose-stack på en enda värd (se deploy/README.md).
#
#   internet ─443─► caddy ──(nät "inre", internt)──► platform ──(volym byggjobb)──► build-worker
#                                                     │                          (inget nät alls)
#                                  egress ◄───────────┘  enda vägen ut, bara listade värdnamn
#                                    │
#                                 (nät "ut") ─► modelleverantör, mejltjänst
#
# Plattformen står ENBART på det interna nätet: den når varken internet, värden eller andra
# containrar utöver proxyn. Varje tjänst får bara de hemligheter den själv behöver.
#
# AI-genererad appkod byggs av build-worker, som saknar nät, hemligheter och Docker-socket och
# bara delar jobbkatalogen med plattformen (packages/build/README.md, drivrutinen spool).

name: vibesandbox

x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped
  init: true
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  caddy:
    <<: *hardening
    build: ./caddy
    image: vibesandbox-caddy:lokal
    cap_add: [NET_BIND_SERVICE]
    ports: ["443:443"]
    environment:
      BASE_DOMAIN: ${BASE_DOMAIN:?BASE_DOMAIN saknas}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL saknas}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:?CLOUDFLARE_API_TOKEN saknas}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    tmpfs: [/tmp]
    networks: [inre, ut]
    depends_on: [platform]
    mem_limit: 256m
    pids_limit: 256

  egress:
    <<: *hardening
    image: vibesandbox-platform:lokal
    command: ["node", "apps/egress/src/main.ts"]
    user: "10001:10001"
    environment:
      EGRESS_ALLOW: ${EGRESS_ALLOW:-api.berget.ai:443,api.eu.mailgun.net:443}
    networks: [inre, ut]
    depends_on: [platform]
    mem_limit: 128m
    pids_limit: 64

  platform:
    <<: *hardening
    build:
      context: ..
      dockerfile: deploy/platform.Dockerfile
    image: vibesandbox-platform:lokal
    user: "10001:10001"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      # Node 24 följer HTTPS_PROXY bara med den här flaggan. Utan den försöker fetch gå direkt —
      # vilket misslyckas på det interna nätet (säkert felläge), men ingenting fungerar då.
      NODE_USE_ENV_PROXY: "1"
      HTTPS_PROXY: http://egress:3128
      NO_PROXY: localhost,127.0.0.1
      BASE_DOMAIN: ${BASE_DOMAIN:?BASE_DOMAIN saknas}
      APP_DOMAIN: ${APP_DOMAIN:-${BASE_DOMAIN}}
      DATA_DIR: /data
      PORT: "8787"
      LISTEN_HOST: 0.0.0.0
      PUBLIC_SCHEME: ${PUBLIC_SCHEME:-https}
      PUBLIC_PORT: ${PUBLIC_PORT:-}
      IDENTITY_PROVIDER: ${IDENTITY_PROVIDER:-email-otp}
      IDENTITY_SECRET: ${IDENTITY_SECRET:-}
      TEST_IDENTITY_SECRET: ${TEST_IDENTITY_SECRET:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.berget.ai/v1}
      LLM_MODEL: ${LLM_MODEL:-zai-org/GLM-5.3-Flash}
      LLM_REASONING_EFFORT: ${LLM_REASONING_EFFORT:-low}
      BERGET_API_KEY: ${BERGET_API_KEY:-}
      MAILGUN_API_KEY: ${MAILGUN_API_KEY:-}
      MAILGUN_DOMAIN: ${MAILGUN_DOMAIN:-}
      MAIL_FROM: ${MAIL_FROM:-}
      BUILD_DRIVER: spool
      BUILD_JOBS_DIR: /jobs
      # Vilken version som är utlagd. Rotsteget sätter den från app/VERSION; tom lokalt.
      APP_VERSION: ${APP_VERSION:-}
      # Plattformstjänster för appar. Tomt = ingen tjänst; en tjänst som inte är med i
      # APP_SERVICES skapas aldrig. Tomma SVC_-värden räknas som "inte satt".
      APP_SERVICES: ${APP_SERVICES:-}
      SVC_FILES_MAX_FILE_MB: ${SVC_FILES_MAX_FILE_MB:-}
      SVC_FILES_QUOTA_MB: ${SVC_FILES_QUOTA_MB:-}
      SVC_FILES_CLAMD: ${SVC_FILES_CLAMD:-}
      SVC_NOTIFY_PER_USER_HOUR: ${SVC_NOTIFY_PER_USER_HOUR:-}
      SVC_NOTIFY_PER_USER_DAY: ${SVC_NOTIFY_PER_USER_DAY:-}
      SVC_NOTIFY_PER_APP_HOUR: ${SVC_NOTIFY_PER_APP_HOUR:-}
      SVC_NOTIFY_PER_APP_DAY: ${SVC_NOTIFY_PER_APP_DAY:-}
      SVC_LLM_MODEL: ${SVC_LLM_MODEL:-}
      SVC_LLM_REASONING_EFFORT: ${SVC_LLM_REASONING_EFFORT:-}
      SVC_LLM_TOKENS_PER_APP_DAY: ${SVC_LLM_TOKENS_PER_APP_DAY:-}
      SVC_LLM_TOKENS_PER_USER_HOUR: ${SVC_LLM_TOKENS_PER_USER_HOUR:-}
      SVC_LLM_TIMEOUT_MS: ${SVC_LLM_TIMEOUT_MS:-}
      SVC_OCR_MODEL: ${SVC_OCR_MODEL:-}
      SVC_OCR_PAGES_PER_APP_DAY: ${SVC_OCR_PAGES_PER_APP_DAY:-}
      SVC_OCR_PAGES_PER_USER_HOUR: ${SVC_OCR_PAGES_PER_USER_HOUR:-}
      SVC_OCR_MAX_FILE_BYTES: ${SVC_OCR_MAX_FILE_BYTES:-}
      SVC_OCR_MAX_PIXELS: ${SVC_OCR_MAX_PIXELS:-}
      SVC_OCR_MAX_PDF_PAGES: ${SVC_OCR_MAX_PDF_PAGES:-}
      SVC_OCR_TIMEOUT_MS: ${SVC_OCR_TIMEOUT_MS:-}
      SVC_HISTORY_RETENTION_DAYS: ${SVC_HISTORY_RETENTION_DAYS:-}
      SVC_SCHEDULE_MAX_PER_APP: ${SVC_SCHEDULE_MAX_PER_APP:-}
      SVC_SCHEDULE_MAX_PER_USER: ${SVC_SCHEDULE_MAX_PER_USER:-}
      SVC_SCHEDULE_MAX_DAYS_AHEAD: ${SVC_SCHEDULE_MAX_DAYS_AHEAD:-}
      SVC_SCHEDULE_TICK_MS: ${SVC_SCHEDULE_TICK_MS:-}
      SVC_TRANSCRIBE_MODEL: ${SVC_TRANSCRIBE_MODEL:-}
      SVC_TRANSCRIBE_CONCURRENCY: ${SVC_TRANSCRIBE_CONCURRENCY:-}
      SVC_TRANSCRIBE_RETENTION_DAYS: ${SVC_TRANSCRIBE_RETENTION_DAYS:-}
      SVC_TRANSCRIBE_MINUTES_PER_APP_DAY: ${SVC_TRANSCRIBE_MINUTES_PER_APP_DAY:-}
      SVC_TRANSCRIBE_MAX_FILE_BYTES: ${SVC_TRANSCRIBE_MAX_FILE_BYTES:-}
      SVC_TRANSCRIBE_TIMEOUT_SECONDS: ${SVC_TRANSCRIBE_TIMEOUT_SECONDS:-}
      SVC_SEARCH_MODEL: ${SVC_SEARCH_MODEL:-}
      SVC_SEARCH_TOKENS_PER_APP_DAY: ${SVC_SEARCH_TOKENS_PER_APP_DAY:-}
      SVC_SEARCH_MAX_DOCUMENTS: ${SVC_SEARCH_MAX_DOCUMENTS:-}
      SVC_SEARCH_QUERIES_PER_USER_MINUTE: ${SVC_SEARCH_QUERIES_PER_USER_MINUTE:-}
      SVC_SEARCH_MAX_VECTORS_PER_APP: ${SVC_SEARCH_MAX_VECTORS_PER_APP:-}
    volumes:
      - ${DATA_ROOT:-/srv/vibesandbox/data}:/data
      - byggjobb:/jobs
    tmpfs: [/tmp]
    networks: [inre]
    mem_limit: 1024m
    pids_limit: 256

  build-worker:
    <<: *hardening
    # Egen, minimal avbild (images/build-worker): bara mallen, SDK:t, kontrakten, policyn och
    # byggkedjan — ingen plattformskod, inga paket för mejl eller språkmodell. Allt i den ägs av
    # root; opålitlig kod kan alltså inte skriva om byggkedjan. Plattformens avbild vore större
    # och innehåller kod som aldrig ska finnas där opålitlig kod byggs.
    build:
      context: ..
      dockerfile: images/build-worker/Dockerfile
    image: vibesandbox-build-worker:lokal
    command: ["node", "images/build-worker/spool-worker.ts"]
    # Samma uid som plattformen: båda läser och skriver /jobs.
    user: "10001:10001"
    # Inget nät alls — inte ens det interna. Bygget behöver inget: beroendena finns i avbilden.
    network_mode: none
    # INGA hemligheter. Bara jobbkatalogen (standard /jobs) och byggkedjans egna gränser.
    environment:
      VIBESANDBOX_JOBS_DIR: /jobs
    tmpfs: ["/tmp:rw,size=512m"]
    volumes:
      - byggjobb:/jobs
    # Plattformen först: dess avbild äger /jobs som uid 10001, och det är den ägaren en ny
    # namngiven volym ärver. (Byggavbilden har ingen /jobs.)
    depends_on: [platform]
    mem_limit: 1536m
    memswap_limit: 1536m
    pids_limit: 256
    cpus: 1.5

networks:
  # Internt: ingen utgång från nätet. Här står plattformen, och hit når caddy och egress.
  inre:
    internal: true
  # Vanligt bryggnät med utgång. Bara caddy (Let's Encrypt, DNS-API) och egress står här.
  # Värdens brandvägg spärrar dessutom tailnetet, privata nät, metadataadressen och SMTP.
  ut: {}

volumes:
  caddy-data:
  caddy-config:
  byggjobb:
